<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>DiaCare - AI Health Assistant</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#2EAF8F',
              tealDark: '#259a7d',
              blue: '#4A90E2',
              bgLight: '#F5FAFF',
              cardBg: '#FFFFFF',
              lightBlueTint: '#EEF6FC',
              purpleAccent: '#EDE8FF',
              subtleGray: '#8A9AAC'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(74, 144, 226, 0.08)',
            'bubble': '0 8px 24px -4px rgba(74, 144, 226, 0.12)'
          }
        }
      }
    };
  </script>
<style data-purpose="custom-styling">
    /* iOS friendly safe-area support & smooth scrolling */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[390px] h-[844px] bg-[#F5FAFF] relative overflow-hidden flex flex-col shadow-2xl sm:rounded-[44px] border-0 sm:border-[8px] sm:border-slate-800" data-purpose="mobile-container">
<!-- BEGIN: iOSStatusBar -->
<header class="pt-3 px-7 flex justify-between items-center text-xs font-semibold text-slate-800 shrink-0 z-30 select-none">
<span>9:41</span>
<!-- Dynamic / Notch island spacing -->
<div class="w-20 h-4 bg-transparent"></div>
<div class="flex items-center space-x-1.5">
<!-- Signal Strength Icons -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.38 2 14.05 2 11.5 2 5.7 6.7 1 12.5 1s10.5 4.7 10.5 10.5c0 2.55-.89 4.88-2.35 6.73l-.62-.62C21.26 16.07 22 14.12 22 12c0-4.97-4.03-9-9-9z"></path><circle cx="12" cy="18" r="2"></circle></svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"></path></svg>
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav aria-label="Top Navigation" class="px-6 pt-3 pb-2 flex items-center shrink-0 z-20">
<button aria-label="Go Back" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-700 hover:bg-slate-200/50 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-base font-semibold text-slate-800 ml-2">AI Health Assistant</h1>
</nav>
<!-- END: TopNavigationBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 overflow-y-auto px-6 pt-2 pb-4 custom-scrollbar flex flex-col justify-start">
<!-- Assistant Mascot Avatar -->
<section class="flex flex-col items-center justify-center mt-3 mb-4" data-purpose="assistant-avatar">
<div class="relative w-20 h-20 rounded-full bg-gradient-to-b from-[#e3f2fd] to-[#d6ebfa] flex items-center justify-center p-3 shadow-sm border-2 border-white">
<!-- Robot Icon SVG matching DiaCare cute theme -->
<svg class="w-12 h-12 text-[#4A90E2]" fill="currentColor" viewbox="0 0 64 64">
<!-- Antenna -->
<circle class="fill-[#4A90E2]" cx="32" cy="11" r="3.5"></circle>
<rect class="fill-[#4A90E2]" height="6" rx="2" width="4" x="30" y="14"></rect>
<!-- Bot Head -->
<rect class="fill-[#4A90E2]" height="28" rx="10" width="34" x="15" y="20"></rect>
<!-- Ears -->
<rect class="fill-[#7EB4F5]" height="10" rx="2" width="4" x="11" y="29"></rect>
<rect class="fill-[#7EB4F5]" height="10" rx="2" width="4" x="49" y="29"></rect>
<!-- Screen Face -->
<rect fill="#FFFFFF" height="20" rx="6" width="26" x="19" y="24"></rect>
<!-- Eyes -->
<circle class="fill-[#2EAF8F]" cx="26" cy="32" r="3"></circle>
<circle class="fill-[#2EAF8F]" cx="38" cy="32" r="3"></circle>
<!-- Smile -->
<path d="M28 37C29.5 39 34.5 39 36 37" fill="none" stroke="#4A90E2" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
</section>
<!-- Welcome Bubble Message -->
<section class="mb-6" data-purpose="assistant-message">
<div class="bg-[#EEF6FC] rounded-2xl rounded-tl-sm p-4 text-center border border-blue-100/50 shadow-sm">
<p class="text-[13px] leading-relaxed text-slate-600 font-normal">
            Hi! I'm your AI health assistant.<br/>
            Ask me anything related to diabetes, diet, exercise or your health records.
          </p>
</div>
</section>
<!-- Prompt Suggestion Chips -->
<section class="space-y-3 flex-1 flex flex-col justify-start" data-purpose="prompt-suggestions">
<!-- Suggestion 1 -->
<button class="w-full text-left bg-white hover:bg-slate-50 border border-slate-100/80 rounded-2xl px-4 py-3.5 shadow-sm text-[13px] text-slate-600 font-medium active:scale-[0.99] transition-all" type="button">
          What foods are good for diabetes?
        </button>
<!-- Suggestion 2 -->
<button class="w-full text-left bg-white hover:bg-slate-50 border border-slate-100/80 rounded-2xl px-4 py-3.5 shadow-sm text-[13px] text-slate-600 font-medium active:scale-[0.99] transition-all" type="button">
          How can I control high sugar levels?
        </button>
<!-- Suggestion 3 -->
<button class="w-full text-left bg-white hover:bg-slate-50 border border-slate-100/80 rounded-2xl px-4 py-3.5 shadow-sm text-[13px] text-slate-600 font-medium active:scale-[0.99] transition-all" type="button">
          What are some easy exercises?
        </button>
<!-- Suggestion 4 -->
<button class="w-full text-left bg-white hover:bg-slate-50 border border-slate-100/80 rounded-2xl px-4 py-3.5 shadow-sm text-[13px] text-slate-600 font-medium active:scale-[0.99] transition-all" type="button">
          Can you explain my recent readings?
        </button>
</section>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: ChatInputSection -->
<section class="px-5 py-2.5 bg-transparent shrink-0" data-purpose="chat-input-bar">
<div class="relative flex items-center bg-white rounded-full border border-slate-200/90 shadow-sm px-4 py-1.5 focus-within:ring-2 focus-within:ring-[#2EAF8F]/30 focus-within:border-[#2EAF8F]">
<input class="w-full bg-transparent text-[13px] text-slate-700 placeholder-slate-400 border-none focus:outline-none focus:ring-0 py-1.5 pr-10" placeholder="Type your question..." type="text"/>
<!-- Send Button -->
<button aria-label="Send Message" class="absolute right-1.5 w-8 h-8 rounded-full bg-[#2EAF8F] hover:bg-[#259a7d] text-white flex items-center justify-center active:scale-90 transition-all shadow-sm" type="button">
<svg class="w-3.5 h-3.5 fill-current transform rotate-0 ml-0.5" viewbox="0 0 24 24">
<path d="M5.536 21.886a1.004 1.004 0 0 1-.77-.36 1.01 1.01 0 0 1-.186-.848l1.79-7.178H13a1 1 0 0 0 0-2H6.37l-1.79-7.178a1.01 1.01 0 0 1 .186-.848 1.006 1.006 0 0 1 1.134-.236l16 8a1 1 0 0 1 0 1.788l-16 8a1.003 1.003 0 0 1-.364.062z"></path>
</svg>
</button>
</div>
</section>
<!-- END: ChatInputSection -->
<!-- BEGIN: BottomNavigation -->
<nav class="bg-white border-t border-slate-100 px-6 pt-2.5 pb-6 flex justify-between items-center text-[10px] text-slate-400 font-medium shrink-0" data-purpose="bottom-navigation-bar">
<!-- Nav Item: Home -->
<button class="flex flex-col items-center space-y-1 hover:text-[#4A90E2] transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4a1 1 0 00-1-1h-2a1 1 0 00-1 1v4a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Home</span>
</button>
<!-- Nav Item: History -->
<button class="flex flex-col items-center space-y-1 hover:text-[#4A90E2] transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>History</span>
</button>
<!-- Nav Item: Alerts -->
<button class="flex flex-col items-center space-y-1 hover:text-[#4A90E2] transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Alerts</span>
</button>
<!-- Nav Item: Profile -->
<button class="flex flex-col items-center space-y-1 hover:text-[#4A90E2] transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Profile</span>
</button>
</nav>
<!-- END: BottomNavigation -->
<!-- Home Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-300 rounded-full pointer-events-none"></div>
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
