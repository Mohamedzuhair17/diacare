<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>DiaCare - Home</title>

<script>
    tailwind.config = {

<style data-purpose="custom-scroll-and-touch">

<body class="bg-[#e4ebf5] min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans antialiased text-slate-800">

</div>

            Anusri <span class="text-xl">👋</span>
</h1>

<rect height="8" rx="4" width="14" x="5" y="8"></rect>
<line x1="12" x2="12" y1="8" y2="16"></line>

<div class="flex items-center space-x-1.5 mt-0.5">
<span class="w-2 h-2 rounded-full bg-[#4A90E2]"></span>

</div>
<span class="text-xs text-slate-500 mt-0.5">Today, 9:00 AM</span>
</div>
</div>

</svg>

<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>

<div class="w-1 h-2 bg-white rounded-full"></div>
<div class="w-1 h-4 bg-white rounded-full"></div>
</div>
</div>

<!-- Card 7: AI Assistant -->
<article class="bg-white rounded-2xl p-4 flex flex-col items-center justify-center border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] hover:shadow-md transition-all cursor-pointer group" data-purpose="action-ai-assistant">

<path d="M12 2a1 1 0 0 1 1 1v1h1a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5h-1v1a1 1 0 1 1-2 0v-1h-2a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5h1V3a1 1 0 0 1 1-1zm-3 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path>
</svg>
</div>
<h3 class="text-sm font-semibold text-slate-700">AI Assistant</h3>

<div class="w-3/4 h-0.5 bg-white/80 rounded-full"></div>
<div class="w-full h-0.5 bg-white/80 rounded-full"></div>
<div class="w-1/2 h-0.5 bg-white/80 rounded-full"></div>
</div>
</div>
<h3 class="text-sm font-semibold text-slate-700">Reports</h3>

</section>

</div>

</div>
