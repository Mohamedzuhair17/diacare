<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>DiaCare - AI Health Assistant</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#2EAF8F',
              tealDark: '#259a7d',
              blue: '#4A90E2',
              bgLight: '#F5FAFF',
              cardBg: '#FFFFFF',
              lightBlueTint: '#EEF6FC',
              purpleAccent: '#EDE8FF',
              subtleGray: '#8A9AAC'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(74, 144, 226, 0.08)',
            'bubble': '0 8px 24px -4px rgba(74, 144, 226, 0.12)'
          }
        }
      }
    };
  </script>
<style data-purpose="custom-styling">
    /* iOS friendly safe-area support & smooth scrolling */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-fadeInUp {
      animation: fadeInUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes bounceDot {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
    .dot-1 {
      animation: bounceDot 1.2s infinite ease-in-out;
    }
    .dot-2 {
      animation: bounceDot 1.2s infinite ease-in-out 0.2s;
    }
    .dot-3 {
      animation: bounceDot 1.2s infinite ease-in-out 0.4s;
    }
  </style>
</head>

<!-- BEGIN: iOSStatusBar -->

<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav aria-label="Top Navigation" class="px-6 pt-3 pb-2 flex items-center shrink-0 z-20">

<!-- Prompt Suggestion Chips -->
<section class="space-y-2.5 flex flex-col justify-start shrink-0" data-purpose="prompt-suggestions" id="suggestionsContainer">
<!-- Suggestion 1 -->
<button class="suggestion-chip w-full text-left bg-white hover:bg-slate-50 border border-slate-100/90 rounded-2xl px-4 py-3 shadow-sm text-[13px] text-slate-700 font-medium active:scale-[0.99] transition-all flex items-center justify-between" data-query="What foods are good for diabetes?" type="button">

<span>How can I control high sugar levels?</span>
<svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<!-- Suggestion 3 -->
<button class="suggestion-chip w-full text-left bg-white hover:bg-slate-50 border border-slate-100/90 rounded-2xl px-4 py-3 shadow-sm text-[13px] text-slate-700 font-medium active:scale-[0.99] transition-all flex items-center justify-between" data-query="What are some easy exercises?" type="button">
<span>What are some easy exercises?</span>
<svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<!-- Suggestion 4 -->
<button class="suggestion-chip w-full text-left bg-white hover:bg-slate-50 border border-slate-100/90 rounded-2xl px-4 py-3 shadow-sm text-[13px] text-slate-700 font-medium active:scale-[0.99] transition-all flex items-center justify-between" data-query="Can you explain my recent readings?" type="button">
<span>Can you explain my recent readings?</span>
<svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</section>
<!-- Dynamic Chat History Injection Target -->
<div class="flex flex-col space-y-3.5 w-full" id="dynamicMessages"></div>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: ChatInputSection -->
<section class="px-5 py-2.5 bg-transparent shrink-0" data-purpose="chat-input-bar">
<form class="relative flex items-center bg-white rounded-full border border-slate-200/90 shadow-sm px-4 py-1.5 focus-within:ring-2 focus-within:ring-[#2EAF8F]/30 focus-within:border-[#2EAF8F]" id="chatForm" onsubmit="event.preventDefault(); handleSend();">
<input autocomplete="off" class="w-full bg-transparent text-[13px] text-slate-700 placeholder-slate-400 border-none focus:outline-none focus:ring-0 py-1.5 pr-10" id="chatInput" placeholder="Type your question..." type="text"/>
<!-- Send Button -->
<button aria-label="Send Message" class="absolute right-1.5 w-8 h-8 rounded-full bg-[#2EAF8F] hover:bg-[#259a7d] text-white flex items-center justify-center active:scale-90 transition-all shadow-sm" id="sendBtn" type="submit">
<svg class="w-3.5 h-3.5 fill-current transform rotate-0 ml-0.5" viewbox="0 0 24 24">
<path d="M5.536 21.886a1.004 1.004 0 0 1-.77-.36 1.01 1.01 0 0 1-.186-.848l1.79-7.178H13a1 1 0 0 0 0-2H6.37l-1.79-7.178a1.01 1.01 0 0 1 .186-.848 1.006 1.006 0 0 1 1.134-.236l16 8a1 1 0 0 1 0 1.788l-16 8a1.003 1.003 0 0 1-.364.062z"></path>

</button>

<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Alerts</span>
</button>
<!-- Nav Item: Profile -->
<button class="flex flex-col items-center space-y-1 hover:text-[#4A90E2] transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-300 rounded-full pointer-events-none"></div>

<script>
  const chatStream = document.getElementById('chatStream');
  const dynamicMessages = document.getElementById('dynamicMessages');
  const chatInput = document.getElementById('chatInput');
  const suggestionsContainer = document.getElementById('suggestionsContainer');

  // Rule-based knowledge base answers
  const answers = {
    food: `🥦 <strong>Recommended for diabetes:</strong><br/>
• Non-starchy vegetables (spinach, broccoli, cauliflower)<br/>
• High-fiber complex carbs (oats, brown rice, quinoa)<br/>
• Healthy fats & proteins (walnuts, chia seeds, eggs, grilled fish)<br/><br/>
💡 <em>Tip: Maintain the 'Plate Method' — 1/2 veggies, 1/4 lean protein, 1/4 whole grains.</em>`,

    sugar: `📉 <strong>Tips to lower & manage blood glucose:</strong><br/>
• Drink plenty of plain water to help kidneys flush out excess sugar<br/>
• Take a brisk 15-20 min walk after meals<br/>
• Avoid sugary drinks, white bread, and refined carbs<br/>
• Always adhere to your prescribed medication schedule (e.g. Metformin)`,

    exercise: `🏃‍♂️ <strong>Safe & effective daily exercises:</strong><br/>
• 30-min brisk walking (lowers insulin resistance)<br/>
• Light yoga and deep breathing to reduce cortisol<br/>
• Resistance bands or light bodyweight squats<br/><br/>
⏱️ <em>Best time: 30 minutes after your largest meal.</em>`,

    readings: `📊 <strong>Reviewing your recent records:</strong><br/>
• Fasting (102 mg/dL): Great job! This is within the normal target range (70–100 mg/dL is standard fasting).<br/>
• After-meal (148 mg/dL): Optimal postprandial control (&lt; 180 mg/dL).<br/><br/>
Keep up your balanced meal routine and regular water intake!`,

    greeting: `👋 <strong>Hello Anusri!</strong> How can I assist you with your glucose tracking, meal planning, or medicine schedule today?`,

    fallback: `🤖 I noted your inquiry. For specific personalized adjustments, always cross-reference with your doctor's plan.<br/><br/>
I can assist with:<br/>
1. Food & meal guidance<br/>
2. Sugar spike control<br/>
3. Safe exercises<br/>
4. Explaining your logged readings`
  };

  function getBotResponse(rawText) {
    const text = rawText.toLowerCase().trim();
    if (text.includes('food') || text.includes('diet') || text.includes('eat') || text.includes('fruit') || text.includes('carb')) {
      return answers.food;
    }
    if (text.includes('control high sugar') || text.includes('high sugar') || text.includes('hyperglycemia') || text.includes('sugar level') || text.includes('levels') || text.includes('glucose')) {
      return answers.sugar;
    }
    if (text.includes('exercise') || text.includes('workout') || text.includes('walk') || text.includes('yoga') || text.includes('stretch')) {
      return answers.exercise;
    }
    if (text.includes('reading') || text.includes('explain') || text.includes('log') || text.includes('102') || text.includes('fasting') || text.includes('record')) {
      return answers.readings;
    }
    if (text === 'hi' || text === 'hello' || text === 'hey' || text.startsWith('hi ') || text.startsWith('hello ')) {
      return answers.greeting;
    }
    return answers.fallback;
  }

  function scrollToBottom() {
    setTimeout(() => {
      chatStream.scrollTo({
        top: chatStream.scrollHeight,
        behavior: 'smooth'
      });
    }, 40);
  }

  function renderUserMessage(text) {
    const wrapper = document.createElement('div');
    wrapper.className = 'flex justify-end animate-fadeInUp';
    wrapper.innerHTML = `
      <div class="max-w-[82%] bg-[#2EAF8F] text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-[13px] leading-relaxed shadow-sm font-normal">
        ${escapeHTML(text)}
      </div>
    `;
    dynamicMessages.appendChild(wrapper);
    scrollToBottom();
  }

  function renderTypingIndicator() {
    const typingId = 'typing-' + Date.now();
    const wrapper = document.createElement('div');
    wrapper.id = typingId;
    wrapper.className = 'flex items-start space-x-2 animate-fadeInUp';
    wrapper.innerHTML = `
      <div class="w-6 h-6 rounded-full bg-[#e3f2fd] border border-white flex items-center justify-center shrink-0 mt-0.5">
        <svg class="w-3.5 h-3.5 text-[#4A90E2]" fill="currentColor" viewBox="0 0 64 64">
          <circle cx="32" cy="11" r="3.5"></circle>
          <rect height="6" rx="2" width="4" x="30" y="14"></rect>
          <rect height="28" rx="10" width="34" x="15" y="20"></rect>
          <rect fill="#FFFFFF" height="20" rx="6" width="26" x="19" y="24"></rect>
          <circle fill="#2EAF8F" cx="26" cy="32" r="3"></circle>
          <circle fill="#2EAF8F" cx="38" cy="32" r="3"></circle>
        </svg>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-2xl rounded-tl-sm px-3.5 py-2.5 flex items-center space-x-1.5">
        <span class="text-[11px] font-medium text-slate-400 mr-1">DiaCare AI is typing</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#2EAF8F] dot-1"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#2EAF8F] dot-2"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#2EAF8F] dot-3"></span>
      </div>
    `;
    dynamicMessages.appendChild(wrapper);
    scrollToBottom();
    return typingId;
  }

  function renderBotResponse(typingId, htmlContent) {
    const typingEl = document.getElementById(typingId);
    if (typingEl) {
      typingEl.remove();
    }

    const wrapper = document.createElement('div');
    wrapper.className = 'flex items-start space-x-2 animate-fadeInUp';
    wrapper.innerHTML = `
      <div class="w-6 h-6 rounded-full bg-[#e3f2fd] border border-white flex items-center justify-center shrink-0 mt-1 shadow-2xs">
        <svg class="w-3.5 h-3.5 text-[#4A90E2]" fill="currentColor" viewBox="0 0 64 64">
          <circle cx="32" cy="11" r="3.5"></circle>
          <rect height="6" rx="2" width="4" x="30" y="14"></rect>
          <rect height="28" rx="10" width="34" x="15" y="20"></rect>
          <rect fill="#FFFFFF" height="20" rx="6" width="26" x="19" y="24"></rect>
          <circle fill="#2EAF8F" cx="26" cy="32" r="3"></circle>
          <circle fill="#2EAF8F" cx="38" cy="32" r="3"></circle>
        </svg>
      </div>
      <div class="max-w-[85%] bg-white border border-slate-100/90 shadow-sm rounded-2xl rounded-tl-sm p-3.5 text-[13px] leading-relaxed text-slate-700 font-normal">
        ${htmlContent}
        <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
          <span>DiaCare Assistant</span>
          <span class="text-slate-400">Just now</span>
        </div>
      </div>
    `;
    dynamicMessages.appendChild(wrapper);
    scrollToBottom();
  }

  function handleSend(promptText) {
    const query = promptText || chatInput.value.trim();
    if (!query) return;

    // Reset input
    chatInput.value = '';

    // If suggestions are visible at the top, subtly collapse them or keep compact
    if (suggestionsContainer) {
      suggestionsContainer.classList.add('opacity-90');
    }

    // 1. User message
    renderUserMessage(query);

    // 2. Typing indicator
    const typingId = renderTypingIndicator();

    // 3. Response after ~700ms
    setTimeout(() => {
      const responseHtml = getBotResponse(query);
      renderBotResponse(typingId, responseHtml);
    }, 750);
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag)
    );
  }

  // Attach chip events
  document.querySelectorAll('.suggestion-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const query = btn.getAttribute('data-query');
      handleSend(query);
    });
  });

  // Back button demo action
  document.getElementById('backBtn').addEventListener('click', () => {
    if (dynamicMessages.children.length > 0) {
      dynamicMessages.innerHTML = '';
      chatInput.value = '';
    }
  });
</script>
</body></html>
